[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "castimonia07", email = "rpandey126.jpsv@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arxiv>=4.0.1",
    "chromadb>=1.5.9",
    "ddgs>=9.16.1",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.1",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "mysql-connector-python>=26.10.0",
    "openai>=3.29.0",
    "pymysql>=1.2.3",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    "streamlit>=1.65.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
